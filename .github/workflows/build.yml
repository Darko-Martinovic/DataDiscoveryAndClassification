name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: SQL Server ${{ matrix.sql-server }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sql-server: ["2019", "2022", "2025"]
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sql-server }}-latest
        env:
          ACCEPT_EULA: "Y"
          # A throwaway password for a throwaway container, the same as SA_PASSWORD below
          MSSQL_SA_PASSWORD: Ddc_Ci_2026!
        ports:
          - 1433:1433
    env:
      SA_PASSWORD: Ddc_Ci_2026!
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade test installs version 1 from the v1-article tag
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the generated scripts are up to date
        shell: pwsh
        run: |
          ./tools/Build-Scripts.ps1
          git diff --exit-code
      - run: dotnet build DataDiscoveryAndClassification
      - name: Install sqlcmd and sqlpackage
        run: |
          curl -sSL https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2 | sudo tar -xj -C /usr/local/bin sqlcmd
          dotnet tool install --global microsoft.sqlpackage --version 170.5.96
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "SQL Server didn't start" && exit 1
      - run: tests/run.sh localhost sa "$SA_PASSWORD"
